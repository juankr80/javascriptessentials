<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css" />
        <script src="contact.js"></script>
        <title>DOM Example 01</title>    
    </head>
    <body>
        <header>
            <h1 id="title">DOM Manipulation Examples</h1>
        </header>

        <main>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="#">Products</a></li>
                    <li class="active"><a href="#">Contact</a></li>
                </ul>
            </nav>    
            
            <div class="tab-panel">
                <h2 class="panel-title">Contact us</h2>
                
                <section id="main-section" class="form-content">
                    <form id="contact-form" novalidate>
                        <div class="form-group">
                            <label for="user-name">Name:</label>
                            <input id="username" class="form-input" type="text" required >
                        </div>

                        <div class="form-group">
                            <label for="user-phone">Phone:</label>
                            <input id="userphone" class="form-input" type="text" maxlength="8" >
                        </div>

                        <div class="form-group">
                            <label for="user-phone">Email:</label>
                            <input id="email" class="form-input" type="email">
                        </div>

                        <div class="form-group">
                            <label for="user-message">Message:</label>
                            <textarea id="usermessage" class="form-input" rows="3" placeholder="Write your message here..."></textarea>
                        </div>

                        <input id="btn-submit" type="submit" class="btn-primary" value="Sent" />
                    </form>
                </section>                                                          
            </div>            
        </main>

        <footer class="main-footer">
            <p>©Copyright 2026. Todos los derechos reservados.</p>
        </footer>
    </body>
</html>
